<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: radial-gradient(circle at 50% 30%, #1d2130 0%, #0d0f15 70%);
      color: #e9e6df;
      font-family: system-ui, -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    figure { margin: 0; width: min(960px, 100%); }
    .stage { border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px rgb(0 0 0 / 0.5); }
    svg { display: block; width: 100%; height: auto; }
    figcaption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 14px;
      font-size: 14px;
      color: #a7a49d;
    }
    button {
      font: inherit;
      color: #f4f1ea;
      background: #2a2f40;
      border: 1px solid #3c4359;
      border-radius: 999px;
      padding: 6px 18px;
      cursor: pointer;
    }
    button:hover { background: #343a4f; }
    button:focus-visible { outline: 2px solid #8ab8ff; outline-offset: 2px; }
  </style>
</head>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const TAU = Math.PI * 2;

      // 与 SVG 坐标保持一致的几何参数
      const BB = { x: 352, y: 344 };            // 中轴
      const CRANK = 30;
      const WHEEL_R = 68;
      const RING_R = 22;
      const GEAR = 1.5;                         // 牙盘半径 22 : 飞轮半径 14.67
      const CADENCE = TAU / 1.8;                // 曲柄角速度 rad/s
      const SPEED = CADENCE * GEAR * WHEEL_R;   // 地面滚动速度与轮速匹配，车轮不打滑
      const CHAIN_SCALE = 300 / 297.4;          // 链条实际长度 → pathLength
      const THIGH = 82;
      const SHIN = 90;
      const ANKLE = { x: -9, y: -11 };          // 踝关节在脚掌局部坐标中的位置

      const legs = [
        { name: 'near', hip: { x: 334, y: 198 }, phase: 0 },
        { name: 'far', hip: { x: 326, y: 196 }, phase: Math.PI },
      ].map((leg) => ({
        ...leg,
        thigh: $(`thigh-${leg.name}`),
        shin: $(`shin-${leg.name}`),
        foot: $(`foot-${leg.name}`),
        crank: $(`crank-${leg.name}`),
      }));

      const clouds = [
        { node: $('cloud-1'), x: 260, y: 64, s: 1, k: 0.05 },
        { node: $('cloud-2'), x: 620, y: 140, s: 0.7, k: 0.035 },
        { node: $('cloud-3'), x: 880, y: 42, s: 0.85, k: 0.065 },
      ];
      const parallax = [
        [$('hills-far'), 0.12],
        [$('hills-near'), 0.3],
        [$('verge'), 0.95],
        [$('foreground'), 1.25],
      ];
      const puffs = [...$('puffs').children];
      const winds = [...$('winds').children];
      const node = {
        spokes: [$('spokes-rear'), $('spokes-front')],
        cog: $('cog'),
        ring: $('ring'),
        chain: $('chain-links'),
        lane: $('lane'),
        rider: $('rider'),
        head: $('head'),
        pouch: $('pouch'),
        crest: $('crest'),
        eye: $('eye'),
        fish: $('fish'),
        scarfA: $('scarf-a'),
        scarfB: $('scarf-b'),
      };

      const r2 = (v) => Math.round(v * 100) / 100;
      const wrap = (v, m) => ((v % m) + m) % m;
      const deg = (rad) => r2((wrap(rad, TAU) * 180) / Math.PI);

      // 两段式反向运动学：由髋和踝求膝，膝盖朝车头方向弯
      function solveKnee(hip, ankle) {
        const dx = ankle.x - hip.x;
        const dy = ankle.y - hip.y;
        const d = Math.min(Math.max(Math.hypot(dx, dy), Math.abs(THIGH - SHIN) + 0.5), THIGH + SHIN - 0.5);
        const a = Math.atan2(dy, dx) - Math.acos((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d));
        return { x: hip.x + THIGH * Math.cos(a), y: hip.y + THIGH * Math.sin(a) };
      }

      // 围巾飘带：振幅沿长度递增、向后传播的正弦波，末端为燕尾缺口
      function ribbon(x0, y0, len, w0, w1, lift, amp, phase) {
        const top = [];
        const bottom = [];
        let endY = y0;
        for (let i = 0; i <= 18; i++) {
          const s = i / 18;
          const x = r2(x0 - len * s);
          const y = y0 + lift * s + amp * s * Math.sin(phase - s * 5.5);
          const half = (w0 + (w1 - w0) * s) / 2;
          top.push(`${x} ${r2(y - half)}`);
          bottom.unshift(`${x} ${r2(y + half)}`);
          endY = y;
        }
        return `M${top.join('L')}L${r2(x0 - len + 5)} ${r2(endY)}L${bottom.join('L')}Z`;
      }

      function render(t) {
        const crank = CADENCE * t;
        const wheel = crank * GEAR;
        const travel = SPEED * t;
        const bob = Math.sin(crank * 2) * 1.6;   // 每踩一脚身体起伏一次

        node.spokes.forEach((g) => g.setAttribute('transform', `rotate(${deg(wheel)})`));
        node.cog.setAttribute('transform', `rotate(${deg(wheel)} 262 332)`);
        node.ring.setAttribute('transform', `rotate(${deg(crank)} 352 344)`);
        node.chain.setAttribute('stroke-dashoffset', r2(-wrap(RING_R * crank * CHAIN_SCALE, 6)));

        for (const leg of legs) {
          const a = crank + leg.phase;
          const px = BB.x + CRANK * Math.cos(a);
          const py = BB.y + CRANK * Math.sin(a);
          const tilt = 8 + 12 * Math.sin(a - 0.4);  // 脚掌随踏板位置自然俯仰
          const rad = (tilt * Math.PI) / 180;
          const ankle = {
            x: px + ANKLE.x * Math.cos(rad) - ANKLE.y * Math.sin(rad),
            y: py + ANKLE.x * Math.sin(rad) + ANKLE.y * Math.cos(rad),
          };
          const hip = { x: leg.hip.x, y: leg.hip.y + bob };
          const knee = solveKnee(hip, ankle);
          leg.thigh.setAttribute('d', `M${r2(hip.x)} ${r2(hip.y)}L${r2(knee.x)} ${r2(knee.y)}`);
          leg.shin.setAttribute('d', `M${r2(knee.x)} ${r2(knee.y)}L${r2(ankle.x)} ${r2(ankle.y)}`);
          leg.foot.setAttribute('transform', `translate(${r2(px)} ${r2(py)}) rotate(${r2(tilt)})`);
          leg.crank.setAttribute('d', `M${BB.x} ${BB.y}L${r2(px)} ${r2(py)}`);
        }

        node.rider.setAttribute('transform', `translate(0 ${r2(bob)})`);
        node.head.setAttribute('transform', `rotate(${r2(Math.sin(crank * 2 + 1.1) * 1.8)} 432 100)`);
        node.pouch.setAttribute('transform', `translate(0 104) scale(1 ${r2(1 + Math.sin(crank * 2 - 0.6) * 0.05)}) translate(0 -104)`);
        node.crest.setAttribute('transform', `rotate(${r2(Math.sin(t * 9) * 5)} 420 80)`);
        const blink = wrap(t, 4.2);
        const lid = blink < 0.16 ? 1 - Math.sin((blink / 0.16) * Math.PI) * 0.9 : 1;
        node.eye.setAttribute('transform', `translate(0 89.5) scale(1 ${r2(lid)}) translate(0 -89.5)`);
        node.fish.setAttribute('transform', `rotate(${r2(Math.sin(t * 7) * 10)} 479 200)`);
        node.scarfA.setAttribute('d', ribbon(378, 123, 80, 10, 6.5, -7, 7, t * 9));
        node.scarfB.setAttribute('d', ribbon(380, 128, 62, 9, 6, 1, 6, t * 9 + 1.4));

        node.lane.setAttribute('stroke-dashoffset', r2(wrap(travel, 80)));
        for (const [g, k] of parallax) g.setAttribute('transform', `translate(${r2(-wrap(travel * k, 800))} 0)`);
        for (const c of clouds) {
          const x = wrap(c.x - travel * c.k + 120, 1040) - 120;
          c.node.setAttribute('transform', `translate(${r2(x)} ${c.y}) scale(${c.s})`);
        }
        puffs.forEach((p, i) => {
          const k = wrap(t / 0.8 + i / puffs.length, 1);
          p.setAttribute('cx', r2(250 - k * 120));
          p.setAttribute('cy', r2(397 - k * 12));
          p.setAttribute('r', r2(3 + k * 8));
          p.setAttribute('opacity', r2(0.5 * (1 - k)));
        });
        winds.forEach((w, i) => {
          const k = wrap(t * 1.1 + i * 0.37, 1);
          w.setAttribute('transform', `translate(${r2(-k * 140)} 0)`);
          w.setAttribute('opacity', r2(Math.sin(k * Math.PI) * 0.75));
        });
      }

      const button = $('toggle');
      let playing = !window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let t = 0;
      let last = performance.now();
      const syncButton = () => { button.textContent = playing ? '暂停' : '播放'; };
      button.addEventListener('click', () => {
        playing = !playing;
        last = performance.now();
        syncButton();
      });

      function frame(now) {
        if (playing) {
          t += Math.min(Math.max((now - last) / 1000, 0), 0.05);
          render(t);
        }
        last = now;
        requestAnimationFrame(frame);
      }

      render(t);
      syncButton();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
